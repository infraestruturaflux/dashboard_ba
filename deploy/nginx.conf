server {
    listen 8070;
    server_name 200.159.177.242;

    # ── Frontend (React build estático) ──────────
    root /opt/ba-dashboard/frontend/dist;
    index index.html;

    # SPA: redireciona tudo para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend (FastAPI via proxy) ───────────────
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Uploads (arquivos anexados) ───────────────
    location /uploads/ {
        alias /opt/ba-dashboard/backend/uploads/;
    }

    # Tamanho máximo de upload (20MB)
    client_max_body_size 20M;
}
